<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | Shorted</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <style>
      /* --- CORE LAYOUT STYLES --- */
      html, body {
        background: #000;
        width: 100%;
        height: 100%;
        overflow: hidden;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      #unity-container {
        position: relative;
        box-shadow: 0 0 20px rgba(0,0,0,0.5); /* Optional: Adds a nice glow */
      }
      #unity-canvas {
        width: 100%;
        height: 100%;
        background: #000;
      }
      #unity-loading-bar, #unity-footer { display: none; } /* Hide default Unity UI */

      /* --- UNIFIED STATUS OVERLAY --- */
      #status-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.8);
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        font-size: 2em;
        z-index: 99;
        cursor: default;
      }

      /* --- ORIENTATION OVERLAY --- */
      #orientation-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: #000;
        color: white;
        display: none;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        font-family: Arial, sans-serif;
        font-size: 1.5em;
        z-index: 100;
      }
      #orientation-overlay svg {
        width: 100px;
        height: 100px;
        margin-bottom: 20px;
        animation: rotate 1.5s ease-in-out infinite;
      }
      @keyframes rotate {
        0% { transform: rotate(0deg); }
        50% { transform: rotate(-90deg); }
        100% { transform: rotate(-90deg); }
      }

      /* --- RE-ENTER FULLSCREEN BUTTON --- */
      #re-fullscreen-button {
        position: absolute;
        top: 10px;
        right: 10px;
        width: 40px;
        height: 40px;
        background: rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.5);
        border-radius: 5px;
        cursor: pointer;
        z-index: 101;
        display: none; /* Hidden by default */
      }
      #re-fullscreen-button:hover { background: rgba(0, 0, 0, 0.7); }
      #re-fullscreen-button svg { width: 70%; height: 70%; margin: 15%; }
    </style>
  </head>
  <body>
    <!-- Overlays for Loading, Orientation, etc. -->
    <div id="status-overlay">
      <div id="status-text">Loading... 0%</div>
    </div>
    <div id="orientation-overlay">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white"><path d="M16.49,4.26l-1.42,1.42c1.9,1.9,1.9,5.0,0,6.9s-5.0,1.9-6.9,0l-1.42,1.42c2.6,2.6,6.9,2.6,9.6,0s2.6-6.9,0-9.6zM20.49,0.26l-1.42,1.42c3.7,3.7,3.7,9.7,0,13.4s-9.7,3.7-13.4,0l-1.42,1.42c4.5,4.5,11.8,4.5,16.3,0s4.5-11.8,0-16.3zM7.51,4.26c-2.6,2.6-2.6,6.9,0,9.6s6.9,2.6,9.6,0l1.42-1.42c-3.4-3.4-8.8-3.4-12.2,0l1.19,1.19L0,15.15l1.5-7.58,1.19,1.19z"/></svg>
        <p>Please rotate your device</p>
    </div>

    <div id="unity-container">
      <canvas id="unity-canvas" width=1920 height=1080 tabindex="-1"></canvas>
      <div id="unity-warning"></div>
      <div id="re-fullscreen-button">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white">
            <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 2h-2v3h-3v2h5v-5zm-3-4V5h-2v2h3v3h2V5h-5z"/>
        </svg>
      </div>
    </div>

    <script>
      // --- ELEMENT SELECTORS ---
      var canvas = document.querySelector("#unity-canvas");
      var statusOverlay = document.querySelector("#status-overlay");
      var statusText = document.querySelector("#status-text");
      var orientationOverlay = document.querySelector("#orientation-overlay");
      var reFullscreenButton = document.querySelector("#re-fullscreen-button");

      // --- BANNER FUNCTION (from your base script) ---
      // A simple banner function for displaying warnings or errors from Unity.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px; color: white;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px; color: black;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }
      
      // --- HELPER FUNCTIONS (Orientation and Resizing) ---
      function checkOrientation() {
        if (window.innerHeight > window.innerWidth && /iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
          orientationOverlay.style.display = 'flex';
        } else {
          orientationOverlay.style.display = 'none';
        }
      }
      function resizeGameContainer() {
        const targetAspectRatio = 1920 / 1080;
        let width = window.innerWidth;
        let height = window.innerHeight;
        if (width / height > targetAspectRatio) {
          width = height * targetAspectRatio;
        } else {
          height = width / targetAspectRatio;
        }
        var container = document.querySelector("#unity-container");
        container.style.width = width + 'px';
        container.style.height = height + 'px';
      }
      
      // Add universal event listeners
      window.addEventListener('resize', () => {
        resizeGameContainer();
        checkOrientation();
      });
      window.addEventListener('orientationchange', () => {
        resizeGameContainer();
        checkOrientation();
      });

      // Initial setup calls
      var meta = document.createElement('meta');
      meta.name = 'viewport';
      meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
      document.getElementsByTagName('head')[0].appendChild(meta);
      

      // --- UNITY BUILD CONFIG (DEFINED *BEFORE* LOADING THE SCRIPT) ---
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/ABN_Sorting.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/ABN_Sorting.data.unityweb", // Adjusted to a common Unity naming convention
        frameworkUrl: buildUrl + "/ABN_Sorting.framework.js.unityweb", // Adjusted
        codeUrl: buildUrl + "/ABN_Sorting.wasm.unityweb", // Adjusted
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany", // Now correctly provided
        productName: "Shorted",      // Now correctly provided
        productVersion: "1.0",         // Now correctly provided
        showBanner: unityShowBanner,
      };

      // --- SCRIPT LOADING AND UNITY INSTANCE CREATION ---
      
      // Initial UI setup before loading starts
      resizeGameContainer();
      checkOrientation();

      var script = document.createElement("script");
      script.src = loaderUrl;
      // The onload event ensures the loader script is ready before we use it
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          // Update your custom loading bar
          statusText.innerHTML = `Loading... ${Math.round(progress * 100)}%`;
        }).then((unityInstance) => {
          // Game has loaded successfully
          statusText.innerHTML = "Tap to Start";
          statusOverlay.style.cursor = 'pointer';
          
          reFullscreenButton.onclick = () => { unityInstance.SetFullscreen(1); };

          function checkFullscreenState() {
            if (document.fullscreenElement || document.webkitFullscreenElement) {
              reFullscreenButton.style.display = 'none';
            } else {
              reFullscreenButton.style.display = 'block';
            }
          }
          
          document.addEventListener('fullscreenchange', checkFullscreenState);
          document.addEventListener('webkitfullscreenchange', checkFullscreenState);
          
          // Add a one-time click event to start the game and enter fullscreen
          statusOverlay.addEventListener('click', () => {
            statusOverlay.style.display = 'none';
            unityInstance.SetFullscreen(1);
            // Check fullscreen state after a short delay to allow the browser to transition
            setTimeout(checkFullscreenState, 500); 
          }, { once: true });

        }).catch((message) => {
          // Handle any errors during initialization
          alert(message);
        });
      };
      
      // Append the script to the body to start the loading process
      document.body.appendChild(script);
    </script>
  </body>
</html>
