<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | Shorted</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <style>
      /* --- CORE LAYOUT STYLES --- */
      html, body {
        background: #000;
        width: 100%;
        height: 100%;
        overflow: hidden;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      #unity-container {
        position: relative;
      }
      #unity-canvas {
        width: 100%;
        height: 100%;
        background: #000;
      }
      #unity-build-title { display: none; }
      #unity-loading-bar { display: none; }

      /* --- UNIFIED STATUS OVERLAY --- */
      #status-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.8);
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        font-size: 2em;
        z-index: 99;
        cursor: default;
      }

      /* --- ORIENTATION OVERLAY --- */
      #orientation-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: #000;
        color: white;
        display: none;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        font-family: Arial, sans-serif;
        font-size: 1.5em;
        z-index: 100;
      }
      #orientation-overlay svg {
        width: 100px;
        height: 100px;
        margin-bottom: 20px;
        animation: rotate 1.5s ease-in-out infinite;
      }
      @keyframes rotate {
        0% { transform: rotate(0deg); }
        50% { transform: rotate(-90deg); }
        100% { transform: rotate(-90deg); }
      }

      /* --- RE-ENTER FULLSCREEN BUTTON --- */
      #re-fullscreen-button {
        position: absolute;
        top: 10px;
        right: 10px;
        width: 40px;
        height: 40px;
        background: rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.5);
        border-radius: 5px;
        cursor: pointer;
        z-index: 101;
        display: none; /* Hidden by default */
      }
      #re-fullscreen-button:hover {
        background: rgba(0, 0, 0, 0.7);
      }
      #re-fullscreen-button svg {
        width: 70%;
        height: 70%;
        margin: 15%;
      }
    </style>
  </head>
  <body>
    <!-- Overlays -->
    <div id="status-overlay">
      <div id="status-text">Loading... 0%</div>
    </div>
    <div id="orientation-overlay">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white"><path d="M16.49,4.26l-1.42,1.42c1.9,1.9,1.9,5.0,0,6.9s-5.0,1.9-6.9,0l-1.42,1.42c2.6,2.6,6.9,2.6,9.6,0s2.6-6.9,0-9.6zM20.49,0.26l-1.42,1.42c3.7,3.7,3.7,9.7,0,13.4s-9.7,3.7-13.4,0l-1.42,1.42c4.5,4.5,11.8,4.5,16.3,0s4.5-11.8,0-16.3zM7.51,4.26c-2.6,2.6-2.6,6.9,0,9.6s6.9,2.6,9.6,0l1.42-1.42c-3.4-3.4-8.8-3.4-12.2,0l1.19,1.19L0,15.15l1.5-7.58,1.19,1.19z"/></svg>
        <p>Please rotate your device</p>
    </div>

    <div id="unity-container">
      <canvas id="unity-canvas" width=1920 height=1080 tabindex="-1"></canvas>
      <div id="unity-warning"></div>
      
      <!-- Re-Enter Fullscreen Button -->
      <div id="re-fullscreen-button">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white">
            <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 2h-2v3h-3v2h5v-5zm-3-4V5h-2v2h3v3h2V5h-5z"/>
        </svg>
      </div>
    </div>

    <script>
      var unityContainer = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var statusOverlay = document.querySelector("#status-overlay");
      var statusText = document.querySelector("#status-text");
      var orientationOverlay = document.querySelector("#orientation-overlay");
      var reFullscreenButton = document.querySelector("#re-fullscreen-button");

      // --- ORIENTATION & RESIZE LOGIC (Unchanged) ---
      function checkOrientation() {
        if (window.innerHeight > window.innerWidth) {
          orientationOverlay.style.display = 'flex';
        } else {
          orientationOverlay.style.display = 'none';
        }
      }
      window.addEventListener('resize', checkOrientation);
      window.addEventListener('orientationchange', checkOrientation);
      checkOrientation();

      function resizeGameContainer() {
        const targetAspectRatio = 1920 / 1080;
        let width = window.innerWidth;
        let height = window.innerHeight;
        let windowAspectRatio = width / height;
        if (windowAspectRatio > targetAspectRatio) {
          width = height * targetAspectRatio;
        } else {
          height = width / targetAspectRatio;
        }
        unityContainer.style.width = width + 'px';
        unityContainer.style.height = height + 'px';
      }
      window.addEventListener('resize', resizeGameContainer);
      resizeGameContainer();

      function unityShowBanner(msg, type) { /* ... Unchanged ... */ }

      // --- UNITY BUILD CONFIG ---
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/ABN_Sorting.loader.js"; // This should match your build files
      var config = { /* ... Your full config object ... */ }; // This should match your build files
      
      var meta = document.createElement('meta');
      meta.name = 'viewport';
      meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
      document.getElementsByTagName('head')[0].appendChild(meta);

      // --- UNITY INSTANCE CREATION & LOADING LOGIC ---
      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          statusText.innerHTML = `Loading... ${Math.round(progress * 100)}%`;

        }).then((unityInstance) => {
          // --- GAME IS LOADED, PREPARE FOR START ---
          
          statusText.innerHTML = "Tap to Start";
          statusOverlay.style.cursor = 'pointer';
          
          // --- RE-FULLSCREEN BUTTON LOGIC ---
          reFullscreenButton.onclick = () => {
            unityInstance.SetFullscreen(1);
          };

          function checkFullscreenState() {
            // Check for any of the vendor-prefixed fullscreen elements
            if (document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement) {
              reFullscreenButton.style.display = 'none';
            } else {
              reFullscreenButton.style.display = 'block';
            }
          }

          // Listen for fullscreen changes (for desktop/reliable browsers)
          document.addEventListener('fullscreenchange', checkFullscreenState);
          document.addEventListener('webkitfullscreenchange', checkFullscreenState);
          
          // "Tap to Start" action
          statusOverlay.addEventListener('click', () => {
            statusOverlay.style.display = 'none';
            unityInstance.SetFullscreen(1);
            
            // --- THE FIX ---
            // Start the periodic check ONLY after the game has started.
            // This acts as a reliable fallback for mobile browser back gestures.
            setInterval(checkFullscreenState, 1000); // Check every second
            
            // Also run a check shortly after to hide the button initially
            setTimeout(checkFullscreenState, 500);

          }, { once: true });

        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
